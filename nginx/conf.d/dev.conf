server {
    listen 80;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
    }

    # Les robots de prévisualisation sociale (WhatsApp, Facebook, Twitter/X, Slack...)
    # n'exécutent pas le JS de la SPA : on leur sert une page HTML avec les balises
    # Open Graph pré-rendues côté backend plutôt que la coquille React.
    location ~ ^/i/(?<slug>[^/]+)$ {
        if ($http_user_agent ~* "facebookexternalhit|Facebot|Twitterbot|WhatsApp|Slackbot|LinkedInBot|TelegramBot|Discordbot|Pinterest|redditbot|Applebot|Googlebot|bingbot") {
            proxy_pass http://backend:4000/api/share/$slug;
            break;
        }
        proxy_pass http://frontend:5173/i/$slug;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://frontend:5173/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
